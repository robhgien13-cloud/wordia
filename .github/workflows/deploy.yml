name: Deploy WORDIA to Neocities

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocities-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract resident portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          base = Path("site/residents")
          files = list(base.glob("*.zip"))
          if not files:
              raise SystemExit("Portrait ZIP not found")
          expected = {"TIME.webp", "FLY_verb.webp", "FLY_noun.webp", "OED.webp", "OALD.webp"}
          optional = {"CURIOSITY.webp", "CAT.webp", "THE.webp", "KILL.webp"}
          target = base / "portraits"
          target.mkdir(parents=True, exist_ok=True)
          found = set()
          for archive in files:
              with ZipFile(archive) as z:
                  for name in expected | optional:
                      matches = [item for item in z.namelist() if Path(item).name == name and not item.endswith("/")]
                      if len(matches) > 1:
                          raise SystemExit(f"Ambiguous portrait in {archive}: {name}")
                      if matches:
                          (target / name).write_bytes(z.read(matches[0]))
                          found.add(name)
          missing = expected - found
          if missing:
              raise SystemExit(f"Missing required portraits: {sorted(missing)}")
          print("Extracted:", ", ".join(sorted(found)))
          PY
      - name: Deploy site files
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: site
          cleanup: false

      - name: Check Neocities API destination
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${NEOCITIES_API_KEY}" \
            https://neocities.org/api/info > /tmp/wordia-neocities-info.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/wordia-neocities-info.json"))
          site=data.get("info",{}).get("sitename") or data.get("sitename")
          print("Neocities API target site:", site)
          if site != "roaenglish":
              raise SystemExit("Wrong Neocities API key target: expected roaenglish")
          PY

      - name: Verify logo test assets through Neocities API
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 \
            --header "Authorization: Bearer ${NEOCITIES_API_KEY}" \
            https://neocities.org/api/list > /tmp/wordia-files.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/wordia-files.json"))
          files={item.get("path","").lstrip("/") for item in data.get("files",[])}
          for path in ["index.html", "logo-test.html", "assets/logos/file_00000000ffa48208950e23312517eabf.png"]:
              print(("FOUND" if path in files else "MISSING"), path)
          if "logo-test.html" not in files:
              raise SystemExit("Logo test page missing from Neocities files")
          if "assets/logos/file_00000000ffa48208950e23312517eabf.png" not in files:
              raise SystemExit("Logo PNG missing from Neocities files")
          PY

      - name: Verify published homepage across cached and fresh URLs
        env:
          SITE_URL: https://roaenglish.neocities.org
        run: |
          python - <<'PY'
          import os, time, urllib.request, re
          base = os.environ["SITE_URL"]
          sha = os.environ.get("GITHUB_SHA", "")[:12]
          urls = [base + "/", base + "/?verify=" + sha]
          for attempt in range(1, 9):
              results = []
              for url in urls:
                  try:
                      request = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 WORDIA-deploy-check",
                          "Cache-Control": "no-cache",
                      })
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          status = response.status
                      title = re.findall(rb"<title[^>]*>(.*?)</title>", body, re.I | re.S)[:1]
                      good = b"<title>WORDIA" in body and b"Welcome to my Website!" not in body
                      print("CHECK", attempt, url, "status", status, "bytes", len(body), "title", title, "valid", good)
                      results.append(good)
                  except Exception as error:
                      print("ERROR", attempt, url, str(error))
                      results.append(False)
              if all(results):
                  print("PASS: both default and cache-busted URLs serve WORDIA")
                  break
              if attempt == 8:
                  raise SystemExit("Homepage inconsistency: Neocities may serve a stale starter page")
              time.sleep(20)
          PY

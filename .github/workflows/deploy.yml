name: Deploy WORDIA to Neocities

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocities-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract resident portraits
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          base = Path("site/residents")
          files = list(base.glob("*.zip"))
          if not files:
              raise SystemExit("Portrait ZIP not found")
          expected = {"TIME.webp", "FLY_verb.webp", "FLY_noun.webp", "OED.webp", "OALD.webp"}
          optional = {"CURIOSITY.webp", "CAT.webp", "THE.webp", "KILL.webp"}
          target = base / "portraits"
          target.mkdir(parents=True, exist_ok=True)
          found = set()
          for archive in files:
              with ZipFile(archive) as z:
                  for name in expected | optional:
                      matches = [item for item in z.namelist() if Path(item).name == name and not item.endswith("/")]
                      if len(matches) > 1:
                          raise SystemExit(f"Ambiguous portrait in {archive}: {name}")
                      if matches:
                          (target / name).write_bytes(z.read(matches[0]))
                          found.add(name)
          missing = expected - found
          if missing:
              raise SystemExit(f"Missing required portraits: {sorted(missing)}")
          print("Extracted:", ", ".join(sorted(found)))
          PY
      - name: Deploy site files
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: site
          cleanup: false

      - name: Verify published site and logo
        env:
          SITE_URL: https://roaenglish.neocities.org
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ["SITE_URL"]
          targets = [
              ("/", b"WORDIA"),
              ("/assets/logos/wordia-emblem-color.svg", b"RESEARCH INSTITUTE"),
          ]
          for path, expected in targets:
              url = base + path
              for attempt in range(1, 9):
                  try:
                      request = urllib.request.Request(
                          url + "?verify=" + os.environ.get("GITHUB_SHA", "")[:12],
                          headers={"User-Agent": "WORDIA-deploy-check/1.0", "Cache-Control": "no-cache"}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                      if expected in body and (path != "/" or b"WORDIA" in body):
                          print("PASS", url, len(body), "bytes")
                          break
                      print("NOT UPDATED", url, "attempt", attempt, "bytes", len(body))
                  except Exception as error:
                      print("CHECK ERROR", url, "attempt", attempt, str(error))
                  if attempt == 8:
                      raise SystemExit("Published site verification failed: " + url)
                  time.sleep(20)
          PY

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>観察記録 No.003 — LOVE IS BLIND | WORDIA研究所</title><style>body{font-family:system-ui,sans-serif;background:#f7f5ef;color:#20394c;line-height:1.85;margin:0}header{background:#173653;color:white;padding:18px 5%}header a{color:white}main{max-width:800px;margin:35px auto;padding:0 20px}article{background:white;border:1px solid #d9d7d0;border-top:4px solid #b58a48;padding:28px}small{color:#667787}h1{font-family:Georgia,serif}a{color:#285b80}.status{background:#f4ecdb;padding:5px 9px;color:#72562d;font-size:.8rem}</style><header><a href="index.html">← 物語観察記録</a></header><main><article><small>観察記録 No.003 / Episode 3</small><h1>LOVE IS BLIND.</h1><p><span class="status">制作中・本文未公開</span></p><p>関連住人：LOVE、IS、BLIND</p><p>花畑で、LOVEは一輪の赤い花に心を奪われる。BLINDは棘の存在を知らせるが、LOVEは手を伸ばす。やがて仮面と二本の鎖を持つISが姿を現す。</p><p>言葉が文となったとき、彼らには何が起こるのか。研究所はこの出来事を観察記録として整理中です。</p><p>本文の公開先は確定次第ご案内します。</p><p><a href="../residents/index.html">関連住人を図鑑で見る →</a></p></article></main></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住人図鑑 | WORDIA研究所</title><style>body{font-family:system-ui,sans-serif;color:#20394c;background:#f7f5ef;margin:0;line-height:1.7}header{background:#173653;color:white;padding:18px 5%}header a{color:white}main{max-width:1050px;margin:35px auto;padding:0 20px}h1{font-family:Georgia,serif}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.filters input,.filters select{padding:12px;border:1px solid #bccbd4;border-radius:5px;font:inherit;background:white}.filters input{flex:2;min-width:210px}.filters select{flex:1;min-width:145px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:white;border:1px solid #d8e0e5;border-top:4px solid #b58a48;padding:20px}.card h2{font:1.6rem Georgia,serif;margin:6px 0}.card small{color:#667787}.card p{font-size:.87rem}a{color:#285b80}.meta{font-size:.8rem;color:#62798b}.profile{font-size:.81rem;margin:12px 0}.profile dt{font-weight:700;color:#173653;margin-top:9px}.profile dd{margin:2px 0 0}.card h2{overflow-wrap:anywhere}.portrait{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center top;background:#eee9df;border:1px solid #e2dbd0;margin-bottom:12px}.portrait[hidden]{display:none} .notice{background:#fcfaf5;border:1px solid #d7c9ae;border-left:4px solid #b58a48;padding:16px 20px;margin:20px 0 24px;font-size:.88rem}.notice strong{color:#173653}.notice p{margin:7px 0 0;line-height:1.85}</style><header><a href="../index.html">← WORDIA研究所</a></header><main><small>RESIDENT ENCYCLOPEDIA</small><h1>住人図鑑</h1><p>名前や種族で住人を検索できます。観察資料は随時追加されます。</p><div class="notice" role="note"><strong>住人の姿について</strong><p>WORDIAの住人たちは、人間世界の写真には写りません。そのため、現在公開している肖像は、研究所が観察情報をもとにAIで仮に再現した「暫定描画記録」です。今後は専門の描画調査員を迎え、住人たちの姿をより詳しく記録していく予定です。</p></div><div class="filters"><input id="q" type="search" placeholder="名前・特徴・役割で検索" aria-label="住人を検索"><select id="species" aria-label="種族"><option value="">すべての分類</option><option value="神">辞書の神々</option><option value="名詞">名詞</option><option value="動詞">動詞</option><option value="限定詞">限定詞</option><option value="複合">複合種族</option></select></div><p id="count" class="meta" aria-live="polite"></p><div id="cards" class="cards"></div><p><a href="latest.html">新着観察記録を見る →</a>　<a href="../episodes/index.html">物語観察記録を見る →</a></p></main><script src="residents.js"></script><script>const cards=document.getElementById('cards'),q=document.getElementById('q'),sp=document.getElementById('species');function render(){const term=q.value.trim().toLowerCase(),kind=sp.value;const found=RESIDENTS.filter(r=>(r.name+' '+r.role+' '+r.species+' '+r.description).toLowerCase().includes(term)&&(!kind||r.species.includes(kind)));cards.replaceChildren(...found.map(r=>{const el=document.createElement('article');el.className='card';const photo=document.createElement('img');photo.className='portrait';photo.src='portraits/'+r.image;photo.alt=r.name+'の外見観察資料';photo.loading='lazy';photo.hidden=true;photo.onload=()=>{photo.hidden=false};photo.onerror=()=>{photo.hidden=true};const h=document.createElement('h2');h.textContent=r.name;const m=document.createElement('small');m.textContent=r.species;const p=document.createElement('p');p.textContent=r.description;const dl=document.createElement('dl');dl.className='profile';for(const [label,value] of [['役割',r.role],['肌の色',r.skin],['身体的特徴',r.traits],['能力・性質',r.ability],['登場記録',r.story]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd)}const a=document.createElement('a');a.href=r.link;a.textContent='物語観察記録へ →';el.append(photo,h,m,p,dl,a);return el}));document.getElementById('count').textContent=found.length+' 件の記録'}q.addEventListener('input',render);sp.addEventListener('change',render);render()</script></html>
